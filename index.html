<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saverr</title>
<meta name="description" content="Vergelijk prijzen van Nederlandse supermarkten en krijg een melding als je favorieten goedkoper worden.">
<meta name="theme-color" content="#0f7b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saverr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{--bg:#f3f1ea;--card:#fff;--ink:#15211b;--muted:#6b756f;--line:#e6e2d6;--green:#0f7b4f;--green-2:#e3f3ea;--deal:#ff5a1f;--deal-2:#fff0e8;--star:#f5b301}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:#d9d5c7;color:var(--ink);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  .phone{width:100%;max-width:400px;height:840px;max-height:calc(100vh - 48px);background:var(--bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(20,30,25,.35),0 0 0 10px #15211b}
  @media (max-width:500px){body{padding:0;background:var(--bg)}.phone{max-width:none;height:100%;max-height:none;border-radius:0;box-shadow:none}}
  header{padding:calc(18px + env(safe-area-inset-top)) 20px 14px;background:var(--green);color:#fff}
  .brand{display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.5px}
  .logo span{color:#9ff0c4}
  .hbtns{display:flex;gap:8px}
  .bell{position:relative;background:rgba(255,255,255,.14);border:0;color:#fff;height:40px;min-width:40px;border-radius:12px;font-size:16px;cursor:pointer;padding:0 10px;font-family:inherit;font-weight:700}
  .bell .dot{position:absolute;top:-4px;right:-4px;background:var(--deal);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--green)}
  .sub{font-size:13px;opacity:.8;margin-top:2px}
  .search{margin-top:14px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 14px}
  .search input{flex:1;border:0;outline:0;padding:13px 0;font:inherit;font-size:15px;color:var(--ink);background:transparent}
  main{flex:1;overflow-y:auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);font-family:inherit}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:16px 2px 10px;letter-spacing:-.2px}
  h2:first-child{margin-top:4px}
  .hint{font-size:13px;color:var(--muted);margin:-4px 2px 12px;line-height:1.45}
  .list{display:flex;flex-direction:column;gap:9px}
  .item{background:var(--card);border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent}
  .item:hover{border-color:var(--line)}
  .item.static{cursor:default}
  .emoji{width:46px;height:46px;border-radius:12px;background:#f6f4ee;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
  .info{flex:1;min-width:0}
  .name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .deal-tag{display:inline-block;background:var(--deal-2);color:var(--deal);font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:6px;margin-top:4px}
  .alarm-tag{display:inline-block;background:#fff4cc;color:#7a5900;font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:6px;margin-top:4px}
  .price{text-align:right;flex:none}
  .price b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px}
  .price s{display:block;font-size:12px;color:var(--muted)}
  .fav{background:none;border:0;font-size:22px;cursor:pointer;color:#cfcabb;flex:none;padding:4px;line-height:1}
  .fav.on{color:var(--star)}
  .empty{text-align:center;color:var(--muted);padding:30px 20px;font-size:14px;line-height:1.5}
  .empty .big{font-size:40px;margin-bottom:8px}
  .alert{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--deal);cursor:pointer}
  .alert.read{border-left-color:var(--line);opacity:.75}
  .store-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;color:#fff;margin-top:4px}
  nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
  nav button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;color:var(--muted);padding:4px 0}
  nav button .ic{font-size:20px}
  nav button.on{color:var(--green);font-weight:700}
  .btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;background:var(--ink);color:#fff;width:100%}
  .btn.green{background:var(--green)} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.orange{background:var(--deal)}
  .btn.sm{width:auto;padding:7px 11px;font-size:12.5px;border-radius:9px}
  /* sheet */
  .scrim{position:absolute;inset:0;background:rgba(15,25,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px 26px;transform:translateY(105%);transition:transform .25s ease;z-index:21;max-height:88%;overflow-y:auto}
  .sheet.show{transform:none}
  .grab{width:40px;height:5px;background:#cfcabb;border-radius:3px;margin:0 auto 14px}
  .sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .sheet-head .emoji{width:60px;height:60px;font-size:34px;background:#fff}
  .sheet-head h3{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;line-height:1.15}
  .favbtn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:12px;background:var(--ink);color:#fff}
  .favbtn.on{background:#fff4cc;color:#7a5900}
  .alarmbox{background:#fff;border-radius:16px;padding:14px;margin-bottom:6px}
  .alarmbox .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .alarmbox .top b{font-size:14.5px}
  .alarmbox .top span{font-size:12.5px;color:var(--muted)}
  .alarmrow{display:flex;gap:8px;align-items:center}
  .eur{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;flex:1;background:#fbfaf6}
  .eur input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;font-weight:600;padding:10px 4px;width:100%}
  .row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .row.best{outline:2px solid var(--green)}
  .logo-sq{width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Bricolage Grotesque',sans-serif}
  .row .st{flex:1;font-size:14px;font-weight:500}
  .row .st small{display:block;color:var(--deal);font-weight:600;font-size:12px}
  .row .st em{display:block;color:var(--muted);font-style:normal;font-size:12px}
  .row .pr{text-align:right;font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
  .row .pr s{display:block;font-family:Inter;font-weight:400;font-size:12px;color:var(--muted)}
  .best-label{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-2);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
  .buy{border:0;background:var(--green);color:#fff;font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:6px 9px;cursor:pointer;margin-left:6px;flex:none}
  .buy.done{background:var(--green-2);color:var(--green);cursor:default}
  /* toast */
  .toast{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.3);transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:30;cursor:pointer}
  .toast.show{transform:none}
  .toast .app-ic{width:38px;height:38px;border-radius:10px;background:var(--green);color:#9ff0c4;font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
  .toast .t1{font-size:12px;color:var(--muted)} .toast .t2{font-size:14px;font-weight:600;line-height:1.3}
  .sim{width:100%;border:1.5px dashed #b9b3a2;background:transparent;border-radius:14px;padding:12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:18px}
  .sim:hover{border-color:var(--green);color:var(--green)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .stat{background:#fff;border-radius:14px;padding:12px}
  .stat b{font-family:'Bricolage Grotesque';font-size:22px;display:block}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.hl{background:var(--deal);color:#fff}.stat.hl span{color:#ffe1d3}
  .stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
  .stat .ico{font-size:16px;margin-bottom:4px;display:block}
  /* home */
  .hello{font-size:13px;color:var(--muted);margin:2px 2px 10px}
  .hero{background:linear-gradient(135deg,#0f7b4f,#0a5a3a);color:#fff;border-radius:20px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden}
  .hero::after{content:'€';position:absolute;right:-8px;bottom:-40px;font-family:'Bricolage Grotesque';font-weight:800;font-size:150px;color:rgba(255,255,255,.07)}
  .hero .lbl{font-size:13px;opacity:.85}
  .hero .amt{font-family:'Bricolage Grotesque';font-weight:800;font-size:42px;letter-spacing:-1px;line-height:1.1;margin:2px 0 4px}
  .hero .trend{display:inline-block;font-size:12px;font-weight:600;background:rgba(159,240,196,.2);color:#9ff0c4;padding:3px 8px;border-radius:7px}
  .bars{display:flex;align-items:flex-end;gap:7px;height:64px;margin-top:14px;position:relative;z-index:1}
  .bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .bars i{display:block;width:100%;background:rgba(255,255,255,.25);border-radius:5px 5px 2px 2px;min-height:3px}
  .bars div.cur i{background:#9ff0c4}
  .bars span{font-size:10px;opacity:.75}
  .dotd{background:linear-gradient(140deg,#ff5a1f,#e8380b);color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden}
  .dotd .k{font-size:12px;font-weight:800;letter-spacing:.8px}
  .dotd .d{font-size:11.5px;opacity:.8;margin-bottom:10px}
  .dotd .body{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .dotd .emoji{background:rgba(255,255,255,.18);width:58px;height:58px;font-size:32px}
  .dotd .pn{font-family:'Bricolage Grotesque';font-size:20px;font-weight:700;line-height:1.1}
  .dotd .pp{font-size:15px;margin-top:3px}.dotd .pp s{opacity:.7}.dotd .pp b{font-family:'Bricolage Grotesque';font-size:20px}
  .dotd .badge{position:absolute;top:14px;right:14px;background:#fff;color:var(--deal);font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;border-radius:12px;padding:6px 10px;transform:rotate(4deg)}
  .dotd .btn{background:#fff;color:var(--deal)}
  .bestdeal{background:#fff;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--deal)}
  .bestdeal .k{font-size:11px;font-weight:700;color:var(--deal);letter-spacing:.4px;text-transform:uppercase}
  .pct{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;color:var(--deal);flex:none;text-align:right;line-height:1}
  .pct small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
  .linkrow{display:flex;justify-content:space-between;align-items:center}
  .linkrow a{font-size:13px;font-weight:600;color:var(--green);cursor:pointer;margin:16px 2px 10px}
  /* challenges */
  .ch{background:#fff;border-radius:16px;padding:14px;margin-bottom:9px}
  .ch .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .ch .t b{font-size:14.5px}
  .ch .t .pts{flex:none;background:#efe9ff;color:#5b3fd1;font-weight:700;font-size:12px;padding:3px 8px;border-radius:7px}
  .ch p{font-size:13px;color:var(--muted);margin:3px 0 10px}
  .prog{height:9px;background:#eeebe2;border-radius:5px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .4s}
  .ch .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .ch.done{outline:2px solid var(--green)}
  .ch.claimed{opacity:.6}
  /* more */
  .profile{background:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .avatar{width:54px;height:54px;border-radius:16px;background:var(--green-2);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{background:#fff;border-radius:16px;padding:14px;cursor:pointer;border:1px solid transparent;text-align:left;font:inherit;color:inherit}
  .tile:hover{border-color:var(--line)}
  .tile .i{font-size:26px;display:block;margin-bottom:8px}
  .tile b{display:block;font-size:14.5px}
  .tile span{font-size:12px;color:var(--muted)}
  .back{background:none;border:0;font:inherit;font-weight:600;color:var(--green);cursor:pointer;font-size:14px;padding:2px 0 8px}
  /* list */
  textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:none;background:#fff;outline:0;min-height:80px}
  textarea:focus{border-color:var(--green)}
  .cmp{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .cmp.win{outline:2px solid var(--green)}
  .dotc{width:13px;height:13px;border-radius:50%;flex:none}
  .cmp .n{flex:1;font-weight:600;font-size:14.5px}
  .cmp .n em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
  .cmp .v{font-family:'Bricolage Grotesque';font-weight:700;font-size:17px}
  .verdict{background:var(--green);color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;font-size:15px;line-height:1.4}
  .verdict b{font-family:'Bricolage Grotesque';font-size:17px}
  .miss{font-size:12.5px;color:#a3480f;background:var(--deal-2);border-radius:10px;padding:8px 10px;margin-top:8px}
  /* board */
  .podium{display:flex;align-items:flex-end;gap:8px;margin:6px 0 14px}
  .podium div{flex:1;text-align:center}
  .podium .av{font-size:30px;width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;border:3px solid var(--line)}
  .podium .p1 .av{border-color:var(--star);width:64px;height:64px;font-size:36px}
  .podium .blk{border-radius:12px 12px 4px 4px;background:#fff;padding:8px 4px;font-size:12px}
  .podium .blk b{display:block;font-family:'Bricolage Grotesque';font-size:15px}
  .podium .p1 .blk{height:84px;background:#fff7d6}.podium .p2 .blk{height:64px}.podium .p3 .blk{height:50px}
  .rank{width:24px;font-family:'Bricolage Grotesque';font-weight:800;color:var(--muted);flex:none;text-align:center}
  .item.me{outline:2px solid var(--green)}
  /* scan */
  .drop{border:2px dashed #b9b3a2;border-radius:18px;padding:26px 16px;text-align:center;background:#fff;cursor:pointer;display:block}
  .drop .i{font-size:42px} .drop b{display:block;margin:6px 0 2px}
  .drop span{font-size:12.5px;color:var(--muted)}
  .scanning{position:relative;border-radius:18px;overflow:hidden;background:#fff;height:220px;display:flex;align-items:center;justify-content:center}
  .scanning img{max-width:100%;max-height:100%;opacity:.8}
  .scanning .bar{position:absolute;left:0;right:0;height:3px;background:var(--green);box-shadow:0 0 18px 4px rgba(15,123,79,.6);animation:scan 1.1s ease-in-out infinite alternate}
  @keyframes scan{from{top:8%}to{top:92%}}
  .receipt{background:#fff;border-radius:6px;padding:16px 16px 18px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;box-shadow:0 2px 0 var(--line)}
  .receipt .hd{text-align:center;margin-bottom:10px}
  .receipt .hd b{font-size:15px}
  .receipt .l{display:flex;justify-content:space-between;padding:2px 0}
  .receipt .k{color:var(--deal);padding-left:12px}
  .receipt hr{border:0;border-top:1px dashed #bbb;margin:8px 0}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .tagrow span{background:var(--green-2);color:var(--green);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px}
  .warn{background:#fff7e0;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13.5px}
  .warn ul{list-style:none;margin-top:6px}
  .warn li{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #f1e6c0;font-size:13px}
  .demo{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
  /* insights */
  .consent{background:#fff;border-radius:18px;padding:18px;text-align:center}
  .consent .i{font-size:44px}
  .consent p{font-size:13.5px;color:var(--muted);line-height:1.5;margin:8px 0 14px}
  .consent ul{text-align:left;font-size:13px;list-style:none;margin:0 0 14px;line-height:1.9}
  .bigspend{background:#fff;border-radius:18px;padding:16px;margin-bottom:9px}
  .bigspend .lbl{font-size:13px;color:var(--muted)}
  .bigspend .amt{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px}
  .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .savebig{background:linear-gradient(135deg,#0f7b4f,#0a5a3a);color:#fff;border-radius:18px;padding:16px;margin-bottom:9px}
  .savebig .amt{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;color:#9ff0c4}
  .brk{margin-top:8px;font-size:13px}
  .brk div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid rgba(255,255,255,.15)}
  .tip{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;margin-bottom:9px;font-size:13.5px;line-height:1.45}
  .tip .i{font-size:22px;flex:none}
  .switch{width:44px;height:26px;border-radius:13px;background:#d6d1c3;position:relative;flex:none;border:0;cursor:pointer}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on{background:var(--green)} .switch.on::after{left:21px}
