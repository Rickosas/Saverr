name: Test (tijdelijk)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 scripts/probe_promos.py
      - run: |
          git config user.name saverr-bot; git config user.email saverr-bot@users.noreply.github.com
          git checkout -b fotokeuze
          git add kandidaten && git commit -qm "kandidaat-foto's" && git push -f origin fotokeuze
