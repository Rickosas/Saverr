name: Test (tijdelijk)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 scripts/probe_promos.py
      - run: |
          git config user.name saverr-bot; git config user.email saverr-bot@users.noreply.github.com
          git fetch origin fotokeuze && git checkout -b fk origin/fotokeuze -- 2>/dev/null || git checkout -b fk
          git checkout fk; git checkout origin/fotokeuze -- kandidaten 2>/dev/null || true
          git add kandidaten && git commit -qm "kandidaat-foto's 2" && git push origin fk:fotokeuze
